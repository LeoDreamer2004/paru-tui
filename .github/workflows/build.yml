name: Release Paru TUI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Arch Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease' >&2
            exit 1
          fi
          echo "PARU_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        # Raster tests also require fc-match and an installed monospace font.
        run: pacman -Syu --noconfirm --needed rust clang git openssl pkgconf zstd fontconfig ttf-dejavu python

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test TUI
        run: cargo test --locked --features tui,generate --lib

      - name: Build release binary
        run: cargo build --locked --release --features tui,generate --bin paru-tui

      - name: Smoke test
        run: target/release/paru-tui --help

      - name: Verify transaction hooks in a disposable root
        run: python3 tests/tui_hooks.py target/release/paru-tui

      - name: Package binary and checksums
        run: bash scripts/package-tui "$RELEASE_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: paru-tui-release
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paru-tui-release
          path: dist

      - name: Verify assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes \
            --title "Paru TUI $RELEASE_TAG" \
            --notes 'Arch Linux x86_64 binary. See BUILD-INFO.txt for the build-time pacman/libalpm and system library versions; keep your system up to date before use.' \
            "${options[@]}"
